# Real-NAT test for the SXDCC reverse-tunnel bounce transport.
#
# The bounce is the only "public" (published) process. The server (bot) and
# client both have NO published ports and reach it outbound-only, which is the
# exact property of a bot behind NAT: inbound connectivity is impossible and all
# traffic must flow through the relay.
#
# Build prerequisites (run once):
#   docker build -f Dockerfile.bounce  -t dinoga-bounce:latest  .
#   docker build -f Dockerfile.nattest -t dinoga-nattest:latest .
# Run:
#   docker compose -p dinoga-nattest -f nat-test/docker-compose.yml up
#   docker compose -p dinoga-nattest -f nat-test/docker-compose.yml logs client server bounce
#   docker compose -p dinoga-nattest -f nat-test/docker-compose.yml down
services:
  bounce:
    image: dinoga-bounce:latest
    command:
      - "-tunnel"
      - "0.0.0.0:40001"
      - "-client-start"
      - "30000"
      - "-client-limit"
      - "30001"
      - "-secret"
      - "test-secret"
    ports:
      - "40001:40001"
      - "30000-30001:30000-30001"

  server:
    image: dinoga-nattest:latest
    command:
      - "-mode"
      - "server"
      - "-tunnel"
      - "bounce:40001"
      - "-secret"
      - "test-secret"
      - "-port"
      - "30000"
      - "-size"
      - "4194304"
    depends_on:
      - bounce

  client:
    image: dinoga-nattest:latest
    command:
      - "-mode"
      - "client"
      - "-target"
      - "bounce:30000"
      - "-size"
      - "4194304"
    depends_on:
      - server