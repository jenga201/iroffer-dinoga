services:
  dinoga:
    build: .
    image: ${IMAGE_NAME:-ghcr.io/jenga201/dinoga}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dinoga}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_DIR:-./files}:/data
    ports:
      - ${PORT_RANGE:-30000-30001}:${PORT_RANGE:-30000-30001}